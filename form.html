<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานบำรุงรักษาแม่พิมพ์ - TNC</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Tahoma", "Arial", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin: 0 0 20px 0;
            font-size: 18px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table th, table td {
            border: 1px solid #333;
            padding: 10px 6px;
            text-align: center;
            vertical-align: middle;
            font-size: 13px;
        }
        table th {
            background-color: #e9e9e9;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            border: none;
            outline: none;
            text-align: center;
            font-size: 13px;
            padding: 4px 2px;
            background: transparent;
        }
        select {
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .time-input {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .time-input input {
            flex: 1;
        }
        .clock-icon {
            font-size: 14px;
            color: #666;
        }
        .total-time {
            background-color: #f9f9f9;
            font-weight: bold;
        }
        .btn-group {
            text-align: center;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 25px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
        }
        .btn-save:hover {
            background-color: #218838;
        }
        .btn-history {
            background-color: #2563eb;
            color: white;
        }
        .btn-history:hover {
            background-color: #1d4ed8;
        }
        .btn-add {
            background-color: #f59e0b;
            color: white;
        }
        .btn-add:hover {
            background-color: #d97706;
        }
        .btn-clear {
            background-color: #6b7280;
            color: white;
        }
        .btn-clear:hover {
            background-color: #4b5563;
        }
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 10px; }
            select { appearance: none; -webkit-appearance: none; -moz-appearance: none; }
            .btn-group { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>TNC THAI NIPPON COMPONENTS CO.,LTD.<br>รายงานบำรุงรักษาแม่พิมพ์ (Die Maintenance Daily Report)</h2>

        <table id="repairTable">
            <thead>
                <tr>
                    <th width="4%">#</th>
                    <th width="11%">ลูกค้า</th>
                    <th width="9%">Part No.</th>
                    <th width="8%">Process</th>
                    <th width="12%">สาเหตุการซ่อม</th>
                    <th width="12%">สาเหตุการเกิดปัญหา</th>
                    <th width="14%">รายละเอียดการซ่อม</th>
                    <th width="6%">ผู้ซ่อม</th>
                    <th width="7%">เวลาเริ่ม</th>
                    <th width="7%">เวลาเสร็จ</th>
                    <th width="7%">รวมเวลา</th>
                    <th width="4%">เสร็จ</th>
                    <th width="7%">หมายเหตุ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="data-row">
                    <td class="row-no">1</td>
                    <td><input type="text" class="customer" placeholder="AIMX"></td>
                    <td><input type="text" class="part-no" placeholder="P181595028"></td>
                    <td><input type="text" class="process" placeholder="1/1"></td>
                    <td>
                        <select class="cause-repair">
                            <option value="">-- เลือก --</option>
                            <option>เจาะ</option>
                            <option>กรีลิ่ว</option>
                            <option>เบี้ย</option>
                            <option>เปลี่ยนเม็ด</option>
                            <option>เปลี่ยนเม็ด+ตัด</option>
                            <option>เปลี่ยนเม็ด+ล้าง</option>
                            <option>ล้างแม่พิมพ์</option>
                            <option>ปรับระดับ</option>
                            <option>อื่นๆ</option>
                        </select>
                    </td>
                    <td>
                        <select class="cause-problem">
                            <option value="">-- เลือก --</option>
                            <option>Punch แตก</option>
                            <option>Punch เบี้ย</option>
                            <option>เม็ดสึกหรอ</option>
                            <option>น้ำมันรั่ว</option>
                            <option>สิ่งสกปรก</option>
                            <option>รอยขีดข่วน</option>
                            <option>ไม่มี</option>
                            <option>อื่นๆ</option>
                        </select>
                    </td>
                    <td>
                        <select class="repair-detail">
                            <option value="">-- เลือก --</option>
                            <option>เปลี่ยนของใหม่</option>
                            <option>ถอดล้าง+ปรับระดับ</option>
                            <option>เปลี่ยนเม็ด</option>
                            <option>ล้างทำความสะอาด</option>
                            <option>เปลี่ยนแหวนรอง</option>
                            <option>เปลี่ยนขอบพลาสติก</option>
                            <option>ปรับแรงดัน</option>
                            <option>ตรวจสอบ+ทดลองเดินเครื่อง</option>
                            <option>อื่นๆ - ระบุ</option>
                        </select>
                    </td>
                    <td><input type="text" class="repaired-by" placeholder="ชื่อ"></td>
                    <td>
                        <div class="time-input">
                            <input type="text" class="time-start" placeholder="--:--" oninput="calculateTotalTime(this)">
                            <span class="clock-icon">ⓞ</span>
                        </div>
                    </td>
                    <td>
                        <div class="time-input">
                            <input type="text" class="time-end" placeholder="--:--" oninput="calculateTotalTime(this)">
                            <span class="clock-icon">ⓞ</span>
                        </div>
                    </td>
                    <td class="total-time total-time-cell">--:--</td>
                    <td><input type="checkbox" class="status-done"></td>
                    <td><input type="text" class="remark" placeholder="-"></td>
                </tr>
            </tbody>
        </table>

        <div class="btn-group">
            <button class="btn btn-save" onclick="saveData()">💾 บันทึกเข้าประวัติ</button>
            <button class="btn btn-history" onclick="goToHistory()">📂 ดูประวัติ</button>
        </div>
    </div>

    <script>
        // คำนวณเวลารวม
        function calculateTotalTime(inputEl) {
            const row = inputEl.closest('.data-row');
            const startTime = row.querySelector('.time-start').value.trim();
            const endTime = row.querySelector('.time-end').value.trim();
            const totalCell = row.querySelector('.total-time-cell');

            const timeRegex = /^([01]?[0-9]|2[0-3]):([0-5][0-9])$/;
            
            if (timeRegex.test(startTime) && timeRegex.test(endTime)) {
                const [startH, startM] = startTime.split(':').map(Number);
                const [endH, endM] = endTime.split(':').map(Number);
                
                let startTotal = startH * 60 + startM;
                let endTotal = endH * 60 + endM;
                
                if (endTotal < startTotal) {
                    endTotal += 24 * 60;
                }
                
                let diffMinutes = endTotal - startTotal;
                let diffH = Math.floor(diffMinutes / 60);
                let diffM = diffMinutes % 60;
                
                totalCell.textContent = `${String(diffH).padStart(2, '0')}:${String(diffM).padStart(2, '0')}`;
            } else {
                totalCell.textContent = '--:--';
            }
        }

        // เพิ่มแถวใหม่
        function addNewRow() {
            const tbody = document.getElementById('tableBody');
            const lastRow = tbody.lastElementChild;
            const lastNum = lastRow ? parseInt(lastRow.querySelector('.row-no').textContent) : 0;
            const newNum = lastNum + 1;
            
            const newRow = document.createElement('tr');
            newRow.className = 'data-row';
            newRow.innerHTML = `
                <td class="row-no">${newNum}</td>
                <td><input type="text" class="customer" placeholder="ลูกค้า"></td>
                <td><input type="text" class="part-no" placeholder="Part No."></td>
                <td><input type="text" class="process" placeholder="Process"></td>
                <td>
                    <select class="cause-repair">
                        <option value="">-- เลือก --</option>
                        <option>เจาะ</option>
                        <option>กรีลิ่ว</option>
                        <option>เบี้ย</option>
                        <option>เปลี่ยนเม็ด</option>
                        <option>เปลี่ยนเม็ด+ตัด</option>
                        <option>เปลี่ยนเม็ด+ล้าง</option>
                        <option>ล้างแม่พิมพ์</option>
                        <option>ปรับระดับ</option>
                        <option>อื่นๆ</option>
                    </select>
                </td>
                <td>
                    <select class="cause-problem">
                        <option value="">-- เลือก --</option>
                        <option>Punch แตก</option>
                        <option>Punch เบี้ย</option>
                        <option>เม็ดสึกหรอ</option>
                        <option>น้ำมันรั่ว</option>
                        <option>สิ่งสกปรก</option>
                        <option>รอยขีดข่วน</option>
                        <option>ไม่มี</option>
                        <option>อื่นๆ</option>
                    </select>
                </td>
                <td>
                    <select class="repair-detail">
                        <option value="">-- เลือก --</option>
                        <option>เปลี่ยนของใหม่</option>
                        <option>ถอดล้าง+ปรับระดับ</option>
                        <option>เปลี่ยนเม็ด</option>
                        <option>ล้างทำความสะอาด</option>
                        <option>เปลี่ยนแหวนรอง</option>
                        <option>เปลี่ยนขอบพลาสติก</option>
                        <option>ปรับแรงดัน</option>
                        <option>ตรวจสอบ+ทดลองเดินเครื่อง</option>
                        <option>อื่นๆ - ระบุ</option>
                    </select>
                </td>
                <td><input type="text" class="repaired-by" placeholder="ชื่อ"></td>
                <td>
                    <div class="time-input">
                        <input type="text" class="time-start" placeholder="--:--" oninput="calculateTotalTime(this)">
                        <span class="clock-icon">ⓞ</span>
                    </div>
                </td>
                <td>
                    <div class="time-input">
                        <input type="text" class="time-end" placeholder="--:--" oninput="calculateTotalTime(this)">
                        <span class="clock-icon">ⓞ</span>
                    </div>
                </td>
                <td class="total-time total-time-cell">--:--</td>
                <td><input type="checkbox" class="status-done"></td>
                <td><input type="text" class="remark" placeholder="-"></td>
            `;
            tbody.appendChild(newRow);
        }

        // บันทึกข้อมูล
        function saveData() {
            const rows = document.querySelectorAll('.data-row');
            const today = new Date();
            const savedDate = today.toLocaleDateString('th-TH');
            let records = [];
            let hasData = false;
            
            rows.forEach((row, index) => {
                const customer = row.querySelector('.customer').value.trim();
                const partNo = row.querySelector('.part-no').value.trim();
                const process = row.querySelector('.process').value.trim();
                const causeRepair = row.querySelector('.cause-repair').value;
                const causeProblem = row.querySelector('.cause-problem').value;
                const repairDetail = row.querySelector('.repair-detail').value;
                const repairedBy = row.querySelector('.repaired-by').value.trim();
                const startTime = row.querySelector('.time-start').value.trim();
                const endTime = row.querySelector('.time-end').value.trim();
                const totalTime = row.querySelector('.total-time-cell').textContent;
                const statusDone = row.querySelector('.status-done').checked;
                const remark = row.querySelector('.remark').value.trim();
                
                if (customer || partNo || startTime || endTime) {
                    hasData = true;
                    records.push({
                        id: Date.now() + index,
                        savedDate: savedDate,
                        checkDate: savedDate,
                        customer: customer,
                        partNo: partNo,
                        process: process,
                        causeRepair: causeRepair,
                        causeProblem: causeProblem
                        ,
                        repairDetail: repairDetail,
                        repairedBy: repairedBy,
                        startTime: startTime,
                        endTime: endTime,
                        workDuration: totalTime,
                        statusDone: statusDone,
                        remarks: remark
                    });
                }
            });

            if (!hasData) {
                alert('⚠️ ไม่มีข้อมูลที่จะบันทึก กรุณากรอกข้อมูลก่อนครับ');
                return;
            }

            // อ่านข้อมูลเดิมจาก localStorage
            let existing = localStorage.getItem('pmHistory');
            let allData = existing ? JSON.parse(existing) : [];
            
            // เพิ่มข้อมูลใหม่เข้าไป
            allData = allData.concat(records);
            
            // บันทึกกลับ
            localStorage.setItem('pmHistory', JSON.stringify(allData));
            
            alert(`✅ บันทึกเรียบร้อย! ทั้งหมด ${records.length} รายการ`);
            
            // ล้างฟอร์มหลังบันทึก
            clearAll();
        }

        // ล้างฟอร์ม
        function clearAll() {
            document.querySelectorAll('.data-row').forEach(row => {
                row.querySelector('.customer').value = '';
                row.querySelector('.part-no').value = '';
                row.querySelector('.process').value = '';
                row.querySelector('.cause-repair').value = '';
                row.querySelector('.cause-problem').value = '';
                row.querySelector('.repair-detail').value = '';
                row.querySelector('.repaired-by').value = '';
                row.querySelector('.time-start').value = '';
                row.querySelector('.time-end').value = '';
                row.querySelector('.total-time-cell').textContent = '--:--';
                row.querySelector('.status-done').checked = false;
                row.querySelector('.remark').value = '';
            });
        }

        // ไปหน้าประวัติ
        function goToHistory() {
            window.location.href = 'history.html';
        }
    </script>
</body>
</html>
